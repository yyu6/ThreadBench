name: Paper website
on:
  pull_request:
    paths: ["docs/**", "scripts/**", "tests/test_paper_site.py", ".github/workflows/paper-site.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "scripts/**", "tests/test_paper_site.py", ".github/workflows/paper-site.yml"]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/build_paper_site.py --check
      - run: python -m unittest discover -s tests -p 'test_paper_site.py' -v
